[project]
name = "mcp-1wrap-openstack"
version = "0.1.0"
description = "1Password launcher for MCP servers (item-per-cloud OpenStack config generator and env injection)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mcp-1wrap = "mcp_1wrap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_1wrap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
