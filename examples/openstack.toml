# ~/.config/mcp-1wrap/profiles/openstack.toml
# Sekretów tu nie ma: tylko nazwy sejfów, tagów i referencje 1Password.
vault   = "Private"
timeout = 60
unset   = ["OS_TAG"]

[[provider]]
type = "openstack"
tag  = "OS_TAG"

